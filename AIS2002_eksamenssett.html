<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIS2002 — Eksamenssett · Muntlig 2025</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
	:root {
		--bg: #e9edf2;
		--panel: #ffffff;
		--ink: #17202b;
		--muted: #5d6b7a;
		--faint: #8b98a6;
		--line: #d3dbe4;
		--line-strong: #b9c4cf;
		--t1: #2f6fdb;
		--t2: #0f9d8f;
		--t3: #d6584f;
		--t4: #d5891a;
		--t5: #7c5cd4;
		--t6: #2f9e57;
		--known: #2f9e57;
		--review: #d5891a;
		--display: "Space Grotesk", system-ui, sans-serif;
		--body: "Inter", system-ui, sans-serif;
		--mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		min-height: 100vh;
		font-family: var(--body);
		color: var(--ink);
		background-color: var(--bg);
		background-image:
			linear-gradient(rgba(120,140,160,0.06) 1px, transparent 1px),
			linear-gradient(90deg, rgba(120,140,160,0.06) 1px, transparent 1px);
		background-size: 28px 28px;
		-webkit-font-smoothing: antialiased;
	}
	.wrap {
		max-width: 860px;
		margin: 0 auto;
		padding: 28px 20px 64px;
	}
	header {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 8px 16px;
		border-bottom: 2px solid var(--ink);
		padding-bottom: 14px;
	}
	.title {
		font-family: var(--display);
		font-weight: 700;
		font-size: 1.5rem;
		letter-spacing: -0.01em;
		line-height: 1.1;
	}
	.title span { color: var(--t1); }
	.subtitle {
		font-family: var(--mono);
		font-size: 0.72rem;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: var(--muted);
	}
	.themes {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		margin: 20px 0 8px;
	}
	.chip {
		font-family: var(--display);
		font-weight: 600;
		font-size: 0.8rem;
		padding: 7px 13px;
		border: 1.5px solid var(--line-strong);
		border-radius: 999px;
		background: var(--panel);
		color: var(--muted);
		cursor: pointer;
		transition: transform 0.08s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
		display: inline-flex;
		align-items: center;
		gap: 8px;
	}
	.chip .dot {
		width: 9px; height: 9px; border-radius: 50%;
		background: var(--c, var(--faint));
		flex: none;
	}
	.chip .n { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }
	.chip:hover { border-color: var(--ink); color: var(--ink); }
	.chip[aria-pressed="true"] {
		background: var(--ink);
		border-color: var(--ink);
		color: #fff;
	}
	.chip[aria-pressed="true"] .n { color: rgba(255,255,255,0.7); }
	.chip:focus-visible { outline: 3px solid var(--t1); outline-offset: 2px; }
	.readout {
		font-family: var(--mono);
		font-size: 0.74rem;
		letter-spacing: 0.04em;
		color: var(--muted);
		display: flex;
		flex-wrap: wrap;
		gap: 6px 18px;
		margin: 14px 2px 16px;
		align-items: center;
	}
	.readout b { color: var(--ink); font-weight: 500; }
	.readout .k { color: var(--known); }
	.readout .r { color: var(--review); }
	.stage { perspective: 1600px; }
	.card {
		position: relative;
		width: 100%;
		min-height: 340px;
		cursor: pointer;
		transform-style: preserve-3d;
		transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
	}
	.card.flipped { transform: rotateY(180deg); }
	.face {
		position: absolute;
		inset: 0;
		backface-visibility: hidden;
		-webkit-backface-visibility: hidden;
		background: var(--panel);
		border: 1.5px solid var(--line);
		border-top: 5px solid var(--c, var(--t1));
		border-radius: 12px;
		box-shadow: 0 12px 30px -18px rgba(20,40,60,0.4);
		padding: 26px 28px 68px;
		display: flex;
		flex-direction: column;
	}
	.face.back { transform: rotateY(180deg); }
	.face-label {
		font-family: var(--mono);
		font-size: 0.68rem;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: var(--c, var(--muted));
		font-weight: 500;
		margin-bottom: 4px;
	}
	.theme-name {
		font-family: var(--display);
		font-weight: 600;
		font-size: 0.82rem;
		color: var(--muted);
		margin-bottom: 18px;
	}
	.qtext {
		font-family: var(--display);
		font-weight: 600;
		font-size: 1.28rem;
		line-height: 1.4;
		letter-spacing: -0.01em;
	}
	.atext {
		font-family: var(--body);
		font-weight: 400;
		font-size: 1.02rem;
		line-height: 1.62;
		color: #22303c;
	}
	.hint {
		position: absolute;
		bottom: 20px; left: 28px; right: 28px;
		font-family: var(--mono);
		font-size: 0.7rem;
		letter-spacing: 0.04em;
		color: var(--faint);
		display: flex;
		justify-content: space-between;
		align-items: center;
	}
	.status-badge {
		font-family: var(--mono);
		font-size: 0.66rem;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		padding: 3px 9px;
		border-radius: 999px;
		border: 1.5px solid currentColor;
	}
	.status-badge.known { color: var(--known); }
	.status-badge.review { color: var(--review); }
	.status-badge.none { display: none; }
	.katex { font-size: 1.02em; }
	.controls {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 10px;
		margin-top: 22px;
	}
	.row { display: flex; gap: 10px; }
	button.act {
		font-family: var(--display);
		font-weight: 600;
		font-size: 0.9rem;
		padding: 12px 14px;
		border-radius: 9px;
		border: 1.5px solid var(--line-strong);
		background: var(--panel);
		color: var(--ink);
		cursor: pointer;
		flex: 1;
		transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
	}
	button.act:hover { border-color: var(--ink); }
	button.act:active { transform: translateY(1px); }
	button.act:focus-visible { outline: 3px solid var(--t1); outline-offset: 2px; }
	button.nav { min-width: 56px; flex: none; font-size: 1.1rem; }
	button.known { border-color: var(--known); color: var(--known); }
	button.known:hover { background: var(--known); color: #fff; }
	button.review { border-color: var(--review); color: var(--review); }
	button.review:hover { background: var(--review); color: #fff; }
	button.wide { grid-column: 1 / -1; }
	.footer-tools {
		margin-top: 16px;
		display: flex;
		justify-content: space-between;
		align-items: center;
		flex-wrap: wrap;
		gap: 10px;
	}
	.mini {
		font-family: var(--mono);
		font-size: 0.72rem;
		letter-spacing: 0.04em;
		color: var(--muted);
		background: none;
		border: none;
		cursor: pointer;
		text-decoration: underline;
		text-underline-offset: 3px;
		padding: 4px;
	}
	.mini:hover { color: var(--t3); }
	.keys {
		font-family: var(--mono);
		font-size: 0.7rem;
		color: var(--faint);
		letter-spacing: 0.03em;
	}
	.keys kbd {
		background: var(--panel);
		border: 1px solid var(--line-strong);
		border-bottom-width: 2px;
		border-radius: 4px;
		padding: 1px 5px;
		font-family: var(--mono);
		font-size: 0.68rem;
		color: var(--ink);
	}
	@media (max-width: 560px) {
		.title { font-size: 1.2rem; }
		.qtext { font-size: 1.1rem; }
		.atext { font-size: 0.96rem; }
		.face { padding: 22px 18px 64px; }
		.hint { left: 18px; right: 18px; }
		.controls { grid-template-columns: 1fr; }
		.keys { display: none; }
	}
	@media (prefers-reduced-motion: reduce) {
		.card { transition: none; }
	}
</style>
</head>
<body>
<div class="wrap">
	<header>
		<div>
			<div class="title">AIS2002 · <span>Reguleringsteknikk</span></div>
			<div class="subtitle">Eksamenssett — følger oppgavearket punkt for punkt</div>
		</div>
		<div class="subtitle" id="deck-tag">Alle tema</div>
	</header>

	<nav class="themes" id="themes" aria-label="Filtrer på tema"></nav>

	<div class="readout" id="readout"></div>

	<div class="stage">
		<div class="card" id="card" role="button" tabindex="0" aria-label="Øvingskort. Trykk mellomrom eller enter for å snu.">
			<div class="face front">
				<div class="face-label">Spørsmål</div>
				<div class="theme-name" id="front-theme"></div>
				<div class="qtext" id="front-q"></div>
				<div class="hint">
					<span>trykk / mellomrom for å snu</span>
					<span class="status-badge none" id="front-badge"></span>
				</div>
			</div>
			<div class="face back">
				<div class="face-label">Svar</div>
				<div class="theme-name" id="back-theme"></div>
				<div class="atext" id="back-a"></div>
				<div class="hint">
					<span>trykk / mellomrom for å snu tilbake</span>
					<span class="status-badge none" id="back-badge"></span>
				</div>
			</div>
		</div>
	</div>

	<div class="controls">
		<div class="row">
			<button class="act nav" id="prev" aria-label="Forrige kort">‹</button>
			<button class="act" id="flip">Snu</button>
			<button class="act nav" id="next" aria-label="Neste kort">›</button>
		</div>
		<div class="row">
			<button class="act known" id="mark-known">✓ Kan det</button>
			<button class="act review" id="mark-review">↻ Repeter</button>
		</div>
		<button class="act wide" id="shuffle">⤨ Stokk kortene</button>
	</div>

	<div class="footer-tools">
		<button class="mini" id="reset">Nullstill all fremgang</button>
		<span class="keys"><kbd>←</kbd> <kbd>→</kbd> bla · <kbd>mellomrom</kbd> snu · <kbd>k</kbd> kan · <kbd>r</kbd> repeter · <kbd>s</kbd> stokk</span>
	</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const THEMES = [
	{ name: "1 · Modellering", color: "var(--t1)" },
	{ name: "2 · Diff.ligninger og overføringsfunksjoner", color: "var(--t2)" },
	{ name: "3 · Poler, nullpunkt og stabilitet", color: "var(--t3)" },
	{ name: "4 · Tidsforløp, 1. og 2. orden", color: "var(--t4)" },
	{ name: "5 · Tilbakekoblede systemer og PID", color: "var(--t5)" },
	{ name: "6 · Frekvensrespons", color: "var(--t6)" }
];

const CARDS = [
	// ---------- 1 Modellering ----------
	{ t:0, ref:"1.1", q:"Figur 1 viser et masse-fjær-demper-system. Hva kan du si om dette systemet?", a:"Lineært, tidsinvariant, 2. ordens. To energilagre (masse = kinetisk, fjær = potensiell) → kan svinge. Inngang $f(t)$, utgang $x(t)$." },
	{ t:0, ref:"1.1", q:"Hvordan vil du gå frem for å lage en matematisk modell av masse-fjær-demper-systemet?", a:"Frilegemediagram → Newtons 2. lov ($\\sum F = m\\ddot{x}$) → kraftbalanse → Laplace med null initialbetingelser → overføringsfunksjon." },
	{ t:0, ref:"1.1", q:"Klarer du å løse masse-fjær-demperen på sparket? ($m=3$ kg, $k=33$ N/m, $c=15$ N·s/m)", a:"$3\\ddot{x}+15\\dot{x}+33x=f(t)$ $\\;\\Rightarrow\\;$ $\\dfrac{X(s)}{F(s)}=\\dfrac{1}{3s^2+15s+33}$" },
	{ t:0, ref:"1.1", q:"Hva blir $\\omega_n$ og $\\zeta$ for masse-fjær-demperen i figur 1?", a:"Del på 3: $s^2+5s+11$. $\\omega_n=\\sqrt{11}\\approx3{,}3$ rad/s, $\\zeta=\\dfrac{5}{2\\sqrt{11}}\\approx0{,}75$ → underdempet." },
	{ t:0, ref:"1.2", q:"Figur 2 viser en RC-krets. Hva kan du si om dette systemet?", a:"Lineært, tidsinvariant, 1. ordens lavpassfilter. Ett energilager (kondensatoren) → ingen svingning. Inngang $v_{in}$, utgang $v_{out}$." },
	{ t:0, ref:"1.2", q:"Hvordan vil du gå frem for å lage en matematisk modell av RC-kretsen?", a:"KVL rundt sløyfen: $v_{in}=v_R+v_C$. Sett inn $v_R=Ri$ og $i=C\\dot{v}_C$ → $RC\\dot{v}_{out}+v_{out}=v_{in}$." },
	{ t:0, ref:"1.2", q:"Klarer du å skrive overføringsfunksjonen til RC-kretsen på sparket?", a:"$\\dfrac{V_{out}(s)}{V_{in}(s)}=\\dfrac{1}{RCs+1}$. Tidskonstant $\\tau=RC$, DC-forsterkning 1, pol i $-1/RC$." },

	// ---------- 2 Differensialligninger og overføringsfunksjoner ----------
	{ t:1, ref:"2", q:"Hva er et dynamisk system?", a:"Utgangen avhenger av inngangens historie, ikke bare nåverdien. Systemet lagrer energi og beskrives med differensialligninger." },
	{ t:1, ref:"2", q:"Beskriv modellformene differensialligning og overføringsfunksjon.", a:"ODE: tidsdomene, knytter sammen deriverte av inngang og utgang. Overføringsfunksjon: $s$-domene, $G(s)=\\dfrac{Y(s)}{X(s)}$ — et algebraisk forhold." },
	{ t:1, ref:"2", q:"Hva skiller de to modellformene, og hvordan konverterer man mellom dem?", a:"Samme informasjon. ODE → TF: Laplace med null initialbetingelser. TF → ODE: kryssmultipliser og invers Laplace. TF gjør kalkulus til algebra og viser poler/nullpunkt direkte." },
	{ t:1, ref:"2", q:"Hva er en tilstandsrommodell?", a:"$\\dot{\\mathbf{x}}=A\\mathbf{x}+B\\mathbf{u}$, $\\mathbf{y}=C\\mathbf{x}+D\\mathbf{u}$. Beskriver indre tilstander, håndterer MIMO og initialbetingelser $\\neq 0$." },
	{ t:1, ref:"2.1", q:"Finn overføringsfunksjonen fra $u$ til $y$: $\\dddot{y}+7\\ddot{y}+3\\dot{y}+6y=2\\ddot{u}+5\\dot{u}-4u$", a:"$\\dfrac{Y(s)}{U(s)}=\\dfrac{2s^2+5s-4}{s^3+7s^2+3s+6}$" },
	{ t:1, ref:"2.1", q:"Hvilke antagelser ligger bak når man utleder en overføringsfunksjon?", a:"Lineært, tidsinvariant, og initialbetingelser lik null. I grunnformen også én inngang og én utgang." },
	{ t:1, ref:"2.2", q:"Hvilken differensialligning hører til $\\dfrac{C(s)}{R(s)}=\\dfrac{s+1}{s^2+3s+2}$?", a:"Kryssmultipliser: $(s^2+3s+2)C=(s+1)R$ → $\\ddot{c}+3\\dot{c}+2c=\\dot{r}+r$" },

	// ---------- 3 Poler, nullpunkt og stabilitet ----------
	{ t:2, ref:"3.1", q:"Definer begrepene pol og nullpunkt.", a:"Pol: verdi av $s$ som gjør $G(s)\\to\\infty$ — rot i nevneren. Nullpunkt: verdi av $s$ som gjør $G(s)=0$ — rot i telleren." },
	{ t:2, ref:"3.1", q:"Hvordan finner du polene og nullpunktene til et gitt system, og avgjør om det er stabilt?", a:"Faktoriser teller og nevner. Nullpunkt = røtter i teller, poler = røtter i nevner. Stabilt hvis alle poler har $\\text{Re}(s)<0$." },
	{ t:2, ref:"3.2", q:"Gitt pol-nullpunkt-kartet i figur 3, hva er den tilhørende overføringsfunksjonen?", a:"Tre poler på den reelle aksen: $s=0$, $s=-2$, $s=-3$. Ingen nullpunkt. $G(s)=\\dfrac{K}{s(s+2)(s+3)}$ — forsterkningen $K$ kan ikke leses av kartet." },
	{ t:2, ref:"3.2", q:"Er systemet i pol-nullpunkt-kartet stabilt?", a:"Nei, det er marginalt stabilt. Polen i $s=0$ ligger på $j\\omega$-aksen (en integrator), ikke i venstre halvplan." },
	{ t:2, ref:"3.3", q:"Forklar konseptet stabilitet, og gi definisjonen.", a:"BIBO: enhver begrenset inngang gir begrenset utgang. Ekvivalent: alle poler i venstre halvplan, slik at den naturlige responsen dør ut." },
	{ t:2, ref:"3.3", q:"Kan du skissere en stabil og en ustabil sprangrespons?", a:"Stabil: stiger og legger seg på en endelig verdi, evt. med dempede svingninger. Ustabil: vokser ubegrenset, eller svinger med økende amplitude." },
	{ t:2, ref:"3.3", q:"Hvordan vil du gå frem for å undersøke stabiliteten til $G_1(s)=\\dfrac{s+4}{s^2+5s+3}$?", a:"Andregrads nevner → løs direkte: $s=\\dfrac{-5\\pm\\sqrt{13}}{2}$ → $-0{,}70$ og $-4{,}30$. Begge i venstre halvplan → stabilt." },
	{ t:2, ref:"3.3", q:"Hvordan vil du gå frem for å undersøke stabiliteten til $G_2(s)=\\dfrac{s^2+2s+1}{s^3+9s^2+5s+55}$?", a:"Alle koeffisienter positive → må bruke Routh–Hurwitz. $s^1$-raden: $\\dfrac{9\\cdot5-1\\cdot55}{9}=-\\dfrac{10}{9}<0$ → to fortegnsskift → to poler i høyre halvplan → ustabilt." },

	// ---------- 4 Tidsforløp ----------
	{ t:3, ref:"4.1", q:"Hvordan vil du gå frem for å skrive ned overføringsfunksjonen fra en sprangrespons?", a:"Sjekk om det er oversving. Uten oversving → 1. ordens: les sluttverdi ($K$) og tid til 63 % av den ($\\tau$). Med oversving → 2. ordens: bruk %OS → $\\zeta$ og $T_p$ → $\\omega_n$." },
	{ t:3, ref:"4.1", q:"Klarer du å skrive ned overføringsfunksjonen til systemet i figur 4 på sparket?", a:"Ingen oversving, sluttverdi 3, 63 % ($\\approx1{,}9$) nås ved $t\\approx0{,}5$ s. $K=3$, $\\tau=0{,}5$ → $G(s)=\\dfrac{3}{0{,}5s+1}=\\dfrac{6}{s+2}$." },
	{ t:3, ref:"4.2", q:"Forklar begrepet forsterkning.", a:"$G(0)$ — det stasjonære forholdet mellom utgang og inngang. Sluttverdien til sprangresponsen delt på sprangets størrelse." },
	{ t:3, ref:"4.2", q:"Forklar begrepet tidskonstant.", a:"$\\tau$: tiden til 63 % av sluttverdien for et 1. ordens system. $\\tau=1/a$ for en pol i $-a$. Mindre $\\tau$ → raskere respons." },
	{ t:3, ref:"4.2", q:"Forklar begrepet dempingsfaktor.", a:"$\\zeta$: forholdet mellom faktisk og kritisk demping. $\\zeta=0$ udempet, $0<\\zeta<1$ underdempet, $\\zeta=1$ kritisk dempet, $\\zeta>1$ overdempet." },
	{ t:3, ref:"4.2", q:"Forklar begrepet naturlig frekvens.", a:"$\\omega_n$: frekvensen systemet ville svingt med uten demping (rad/s). Faktisk dempet frekvens: $\\omega_d=\\omega_n\\sqrt{1-\\zeta^2}$." },
	{ t:3, ref:"4.3", q:"Er sprangresponsene i figur 5 kritisk dempet, overdempet, underdempet eller udempet?", a:"Begge er underdempet — de har oversving og avtagende svingninger, men går mot en endelig verdi." },
	{ t:3, ref:"4.3", q:"Hvilken av de to responsene har lavest dempingsfaktor?", a:"Respons (c) — størst oversving (ca. 37 % mot ca. 25 %) og flere svingninger før den legger seg." },
	{ t:3, ref:"4.3", q:"Oppgi ca. %OS, $T_p$ og $T_s$ for respons (b).", a:"Sluttverdi $\\approx11$, topp $\\approx13{,}5$ ved $t\\approx1$ s. %OS $\\approx25$ %, $T_p\\approx1$ s, $T_s\\approx3{,}5$ s. Gir $\\zeta\\approx0{,}4$ og $\\omega_n\\approx3{,}4$ rad/s." },
	{ t:3, ref:"4.3", q:"Oppgi ca. %OS, $T_p$ og $T_s$ for respons (c).", a:"Sluttverdi $\\approx1$, topp $\\approx1{,}37$ ved $t\\approx4$ s. %OS $\\approx37$ %, $T_p\\approx4$ s, $T_s\\approx18$ s. Gir $\\zeta\\approx0{,}3$ og $\\omega_n\\approx0{,}85$ rad/s." },

	// ---------- 5 Tilbakekoblede systemer og PID ----------
	{ t:4, ref:"5.1", q:"Hvordan vil du gå frem for å sjekke stabilitet og egenskaper til tidsforløpet til systemet i figur 6?", a:"Finn lukket overføringsfunksjon $T(s)=\\dfrac{G}{1+G}$. Polene er røttene i $1+G(s)=0$. Sjekk at de ligger i venstre halvplan, og les av $\\zeta$ og $\\omega_n$." },
	{ t:4, ref:"5.1", q:"Regn ut lukket overføringsfunksjon for motorsløyfen $G(s)=\\dfrac{25}{s(s+1)}$ med enhets-tilbakekobling.", a:"$T(s)=\\dfrac{25/(s(s+1))}{1+25/(s(s+1))}=\\dfrac{25}{s^2+s+25}$" },
	{ t:4, ref:"5.1", q:"Hva er $\\omega_n$, $\\zeta$ og stabiliteten til motorsløyfen?", a:"$\\omega_n=5$ rad/s, $2\\zeta\\omega_n=1\\Rightarrow\\zeta=0{,}1$. Stabil (begge poler i venstre halvplan), men svært lite dempet → ca. 73 % oversving." },
	{ t:4, ref:"5.2", q:"Hva er en regulator?", a:"Beregner pådraget ut fra avviket ($r-y$) for å få prosessen til å oppføre seg som ønsket: raskere, mer nøyaktig og stabil." },
	{ t:4, ref:"5.2", q:"Hva står forkortelsen PID for?", a:"Proporsjonal–Integral–Derivat. $C(s)=K_p+\\dfrac{K_i}{s}+K_d s$" },
	{ t:4, ref:"5.2", q:"Hva er rollen til P-leddet?", a:"Virker på nåværende avvik. Raskere respons og mindre avvik, men fjerner det ikke helt. For høy $K_p$ → oversving og fare for ustabilitet." },
	{ t:4, ref:"5.2", q:"Hva er rollen til I-leddet?", a:"Virker på oppsamlet avvik. Fjerner stasjonært avvik. Ulemper: faseforsinkelse, tregere respons, fare for vindup." },
	{ t:4, ref:"5.2", q:"Hva er rollen til D-leddet?", a:"Virker på endringsraten til avviket (forutser framtiden). Gir demping og mindre oversving. Følsom for målestøy → filtreres." },
	{ t:4, ref:"5.2", q:"Hva menes med tuning av en regulator?", a:"Å velge $K_p$, $K_i$ og $K_d$ slik at kravene oppfylles. Metoder: prøving og feiling, Ziegler–Nichols, modellbasert design." },
	{ t:4, ref:"5.2", q:"Hva slags type krav kan man stille til ytelsen til et reguleringssystem?", a:"Transient: $T_r$, $T_s$, %OS, $T_p$. Stasjonært: avvik lik null eller begrenset. I tillegg stabilitetsmarginer og undertrykking av forstyrrelser/støy." },
	{ t:4, ref:"5.2", q:"Forklar fremgangsmåten for å stille inn regulatorparametre for ønskede egenskaper.", a:"Krav → ønsket $\\zeta$, $\\omega_n$ eller polplassering → velg struktur (P/PI/PID) → juster forsterkningene (rotlokus, polplassering, Routh-grenser) → verifiser ved simulering." },
	{ t:4, ref:"5.2", q:"Hvilke ting må man passe på når man bruker integraleffekt i regulatoren?", a:"Vindup ved aktuatormetning (krever anti-vindup). Integralet gir også faseforsinkelse → dårligere stabilitetsmargin og mer svingende respons." },

	// ---------- 6 Frekvensrespons ----------
	{ t:5, ref:"6", q:"Hva kalles denne typen plot (figur 7)?", a:"Bode-diagram: amplitude i dB ($20\\log_{10}|G(j\\omega)|$) og fase i grader, begge mot $\\log\\omega$." },
	{ t:5, ref:"6", q:"Finnes det en annen måte å visualisere frekvensresponsen på?", a:"Nyquist-diagram: polarplott av $G(j\\omega)$ i det komplekse planet. Nichols-diagram er et tredje alternativ." },
	{ t:5, ref:"6", q:"Forklar hva frekvensresponsen forteller oss.", a:"Forsterkning og faseforskyvning for hver enkelt frekvens → båndbredde, resonans og filtreringsegenskaper, samt relativ stabilitet via fase- og forsterkningsmargin." },
	{ t:5, ref:"6", q:"Hva kan du si om systemet basert på figur 7?", a:"1. ordens lavpassfilter. Flat på 10 dB ($\\approx3{,}16$) ved lave frekvenser, knekkfrekvens $\\approx10$ rad/s, faller $-20$ dB/dekade, fase $0°\\to-90°$. $G(s)\\approx\\dfrac{3{,}16}{0{,}1s+1}$." }
];

const STORAGE_KEY = "ais2002_eksamenssett_2025";
let status = {};
let filter = "all";
let deck = [];
let pos = 0;
let flipped = false;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

async function loadStatus() {
	try {
		if (window.storage && window.storage.get) {
			const r = await window.storage.get(STORAGE_KEY);
			if (r && r.value) return JSON.parse(r.value);
		}
	} catch (e) { /* fall through */ }
	return {};
}
async function saveStatus() {
	try {
		if (window.storage && window.storage.set) {
			await window.storage.set(STORAGE_KEY, JSON.stringify(status));
		}
	} catch (e) { /* non-fatal */ }
}

function buildDeck() {
	deck = CARDS.map((_, i) => i).filter(i => filter === "all" || CARDS[i].t === Number(filter));
	pos = 0;
	flipped = false;
}
function shuffle() {
	for (let i = deck.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[deck[i], deck[j]] = [deck[j], deck[i]];
	}
	pos = 0;
	flipped = false;
	render();
}

function renderMath(el) {
	if (window.renderMathInElement) {
		renderMathInElement(el, {
			delimiters: [{ left: "$", right: "$", display: false }],
			throwOnError: false
		});
	}
}
function statusBadge(el, st) {
	el.className = "status-badge " + (st || "none");
	el.textContent = st === "known" ? "kan" : st === "review" ? "repeter" : "";
}
function render() {
	const cardEl = document.getElementById("card");
	if (deck.length === 0) return;
	const idx = deck[pos];
	const c = CARDS[idx];
	const th = THEMES[c.t];

	document.querySelectorAll(".face").forEach(f => f.style.setProperty("--c", th.color));

	const fq = document.getElementById("front-q");
	const ba = document.getElementById("back-a");
	document.getElementById("front-theme").textContent = th.name + (c.ref ? "  ·  oppgave " + c.ref : "");
	document.getElementById("back-theme").textContent = th.name + (c.ref ? "  ·  oppgave " + c.ref : "");
	fq.textContent = c.q;
	ba.textContent = c.a;
	renderMath(fq);
	renderMath(ba);

	statusBadge(document.getElementById("front-badge"), status[idx]);
	statusBadge(document.getElementById("back-badge"), status[idx]);

	if (reduceMotion) {
		cardEl.style.transition = "none";
		cardEl.classList.toggle("flipped", flipped);
		void cardEl.offsetWidth;
		cardEl.style.transition = "";
	} else {
		cardEl.classList.toggle("flipped", flipped);
	}

	renderReadout();
}
function renderReadout() {
	const total = deck.length;
	let known = 0, review = 0;
	deck.forEach(i => { if (status[i] === "known") known++; else if (status[i] === "review") review++; });
	document.getElementById("readout").innerHTML =
		"KORT <b>" + String(pos + 1).padStart(2, "0") + "/" + String(total).padStart(2, "0") + "</b>" +
		' · <span class="k">KAN ' + known + "</span>" +
		' · <span class="r">REPETER ' + review + "</span>" +
		" · IGJEN " + (total - known - review);
	document.getElementById("deck-tag").textContent =
		filter === "all" ? "Alle tema" : THEMES[Number(filter)].name;
}
function renderThemes() {
	const nav = document.getElementById("themes");
	const counts = THEMES.map((_, t) => CARDS.filter(c => c.t === t).length);
	let html = '<button class="chip" data-f="all" aria-pressed="' + (filter === "all") + '">' +
		'<span class="dot" style="--c:var(--ink)"></span>Alle <span class="n">' + CARDS.length + '</span></button>';
	THEMES.forEach((th, t) => {
		html += '<button class="chip" data-f="' + t + '" aria-pressed="' + (filter == t) + '">' +
			'<span class="dot" style="--c:' + th.color + '"></span>' + th.name +
			'<span class="n">' + counts[t] + '</span></button>';
	});
	nav.innerHTML = html;
	nav.querySelectorAll(".chip").forEach(btn => {
		btn.addEventListener("click", () => {
			filter = btn.dataset.f;
			buildDeck();
			renderThemes();
			render();
		});
	});
}

function flip() { flipped = !flipped; document.getElementById("card").classList.toggle("flipped", flipped); }
function next() { pos = (pos + 1) % deck.length; flipped = false; render(); }
function prev() { pos = (pos - 1 + deck.length) % deck.length; flipped = false; render(); }
function mark(st) {
	const idx = deck[pos];
	if (status[idx] === st) { delete status[idx]; }
	else { status[idx] = st; }
	saveStatus();
	statusBadge(document.getElementById("front-badge"), status[idx]);
	statusBadge(document.getElementById("back-badge"), status[idx]);
	renderReadout();
	if (status[idx]) setTimeout(next, 180);
}
async function resetAll() {
	status = {};
	await saveStatus();
	render();
}

document.getElementById("card").addEventListener("click", flip);
document.getElementById("flip").addEventListener("click", flip);
document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);
document.getElementById("shuffle").addEventListener("click", shuffle);
document.getElementById("mark-known").addEventListener("click", () => mark("known"));
document.getElementById("mark-review").addEventListener("click", () => mark("review"));
document.getElementById("reset").addEventListener("click", resetAll);
document.getElementById("card").addEventListener("keydown", e => {
	if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
document.addEventListener("keydown", e => {
	if (e.target && e.target.tagName === "INPUT") return;
	if (e.key === "ArrowRight") next();
	else if (e.key === "ArrowLeft") prev();
	else if (e.key.toLowerCase() === "s") shuffle();
	else if (e.key.toLowerCase() === "k") mark("known");
	else if (e.key.toLowerCase() === "r") mark("review");
});

(async function init() {
	status = await loadStatus();
	buildDeck();
	renderThemes();
	render();
})();
</script>
</body>
</html>
